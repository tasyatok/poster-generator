<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Poster Generator</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
</head>
<body>
  <main id="stage">
    <!-- p5 canvas will be injected here -->
  </main>

  <!-- UI buttons -->
  <div id="ui">
    <button onclick="colsDown()">− Col</button>
    <button onclick="colsUp()">+ Col</button>

    <button onclick="rowsDown()">− Row</button>
    <button onclick="rowsUp()">+ Row</button>

    <button onclick="savePoster()">Save PNG</button>
  </div>

  <script src="sketch.js"></script>
</body>
</html>
