<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Poster Generator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- p5 -->
    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.3/lib/p5.min.js"></script>

    <!-- your files -->
    <link rel="stylesheet" href="style.css" />
    <script defer src="sketch.js"></script>
  </head>

  <body>
    <div id="stage"></div>

    <!-- Controls -->
    <div id="ui">
      <button onclick="colsDown()">− Col</button>
      <button onclick="colsUp()">+ Col</button>
      <button onclick="rowsDown()">− Row</button>
      <button onclick="rowsUp()">+ Row</button>
      <button onclick="savePoster()">Save PNG</button>
    </div>
  </body>
</html>
