<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Poster Generator</title>

  <style>
    :root{
      --margin: 50px;
    }

    html, body{
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #fff;
      overflow: hidden;
    }

    body{
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #frame{
      width: calc(100vw - var(--margin)*2);
      height: calc(100vh - var(--margin)*2);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas{
      display: block;
      max-width: 100%;
      max-height: 100%;
    }

    /* Mobile: slightly smaller margin, centered */
    @media (max-width: 768px){
      :root{
        --margin: 16px;
      }
    }
  </style>
</head>

<body>
  <div id="frame"></div>

  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
  <script src="./sketch.js"></script>
</body>
</html>
