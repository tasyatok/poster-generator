<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Poster Generator</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.2/lib/p5.min.js"></script>
</head>
<body>
  <div id="stage"></div>

  <div id="uiBottom">
    <!-- LEFT: grid controls -->
    <div class="uiSide">
      <div class="group">
        <span class="label">Cols</span>
        <button class="btn square" onclick="colsDown()">–</button>
        <button class="btn square" onclick="colsUp()">+</button>
      </div>

      <div class="group">
        <span class="label">Rows</span>
        <button class="btn square" onclick="rowsDown()">–</button>
        <button class="btn square" onclick="rowsUp()">+</button>
      </div>
    </div>

    <!-- RIGHT: actions -->
    <div class="uiSide">
      <button class="btn action" onclick="swapNextPair()">Swap</button>
      <button class="btn action" onclick="savePoster()">Save</button>
    </div>
  </div>

  <script src="sketch.js"></script>
</body>
</html>
